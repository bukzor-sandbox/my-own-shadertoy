# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: "https://json-schema.org/draft/2020-12/schema"
title: milestone claim frontmatter
description: >-
  One claim per milestone: the local claim schema plus `first-uses:`. The
  roll-up, `milestone-ladder.md`, states how milestone files are named and when
  a milestone has landed.
$ref: "../../jsonschema/claim.jsonschema.yaml#base"
properties:
  first-uses:
    description: >-
      The milestone's first uses in the codebase of each concept relevant to the
      project and new to bukzor (WebGPU APIs and WGSL features, commonly, but
      not only): the record `FIRST_INSTANCE` is confirmed against. Filled when
      the milestone lands. Claude lists relevant candidates generously; listing
      a use means bukzor confirmed at landing that it was learning and that
      bukzor typed it. A milestone with nothing recorded omits the key.
    type: array
    minItems: 1
    items:
      type: object
      required: [use, evidence]
      additionalProperties: false
      properties:
        use:
          description: >-
            The API or feature, as the code spells it (`device.lost`,
            `@workgroup_size`).
          type: string
        evidence:
          description: >-
            Where the use lives, each as `path:funcname`
            (`packages/gpu/device/src/index.ts:init`): stable across edits,
            greppable.
          type: array
          minItems: 1
          items:
            type: string
unevaluatedProperties: false
