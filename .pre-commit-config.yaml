# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json

# Test data is deliberately malformed; no hook may "fix" it.
exclude: /testdata/

repos:
  # Project-specific hooks are local so dev tooling and pre-commit always match
  - repo: local
    hooks:
      # Type-aware lint needs the whole program, so it takes no filenames.
      # Autofix first, then format (oxfmt has the last word).
      # json: its config, tsconfig, and package.json (tool versions) are inputs.
      - id: oxlint
        name: oxlint
        entry: bin/pnpm-run oxlint --fix
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
        pass_filenames: false

      # Formatter and import sorting -- configured in .oxfmtrc.json
      - id: oxfmt
        name: oxfmt
        entry: bin/pnpm-run oxfmt --no-error-on-unmatched-pattern
        language: system
        types: [text]

      # Whole-workspace typecheck, after formatting for cleaner output
      - id: typecheck
        name: typecheck
        entry: bin/pnpm-run pnpm run typecheck
        language: system
        types_or: [ts, tsx, json]
        pass_filenames: false

      # The toolchain's own regression suite; only when it or its config moves
      - id: engprod-selftest
        name: engprod selftest
        entry: bin/pnpm-run pnpm run selftest
        language: system
        files: ^(\.oxlintrc\.json|\.oxfmtrc\.json|\.editorconfig|tsconfig\.base\.json|package\.json|lib/engprod-selftest/)
        pass_filenames: false

  # Standard file hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
        exclude: tsconfig.*\.json$ # jsonc
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
